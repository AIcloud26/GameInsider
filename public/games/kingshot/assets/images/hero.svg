<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Stylised kingdom stronghold illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2440"/>
      <stop offset="1" stop-color="#0f1526"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.8" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#sky)"/>
  <circle cx="470" cy="140" r="120" fill="url(#glow)"/>
  <!-- distant hills -->
  <path d="M0 360 C140 320 240 360 360 336 C480 312 560 344 640 328 L640 480 L0 480 Z" fill="#1a2340"/>
  <path d="M0 400 C160 372 300 408 460 384 C540 372 600 388 640 380 L640 480 L0 480 Z" fill="#141b30"/>
  <!-- castle -->
  <g fill="#e8edf7" opacity="0.92">
    <rect x="250" y="250" width="140" height="120" rx="4"/>
    <rect x="232" y="270" width="34" height="100" rx="4"/>
    <rect x="374" y="270" width="34" height="100" rx="4"/>
    <rect x="306" y="214" width="28" height="156" rx="4"/>
  </g>
  <!-- battlements -->
  <g fill="#0f1526">
    <rect x="250" y="240" width="16" height="14"/><rect x="278" y="240" width="16" height="14"/>
    <rect x="306" y="240" width="16" height="14"/><rect x="334" y="240" width="16" height="14"/>
    <rect x="362" y="240" width="16" height="14"/>
  </g>
  <g fill="#f59e0b">
    <rect x="312" y="196" width="16" height="18" rx="2"/>
    <path d="M328 196 h22 l-4 9 4 9 h-22 Z"/>
  </g>
  <g fill="#0f1526">
    <rect x="308" y="318" width="24" height="52" rx="10"/>
  </g>
  <g fill="#38bdf8" opacity="0.85">
    <rect x="240" y="300" width="18" height="22" rx="3"/>
    <rect x="382" y="300" width="18" height="22" rx="3"/>
  </g>
  <!-- ground accent -->
  <rect x="0" y="370" width="640" height="6" fill="#f59e0b" opacity="0.35"/>
</svg>
